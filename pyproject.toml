[project]
name = "awam-resource-gateway"
version = "0.1.0"
description = "Unified awam:// resource gateway (MCP + localhost HTTP) for Sigma/AI/DOpus"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "mcp>=2.0",
  "httpx>=0.27",
  "uvicorn>=0.30",
  "starlette>=0.37",
]

[project.scripts]
awam-resource-gateway = "awam_resource_gateway.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
